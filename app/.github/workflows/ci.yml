name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions: 
    contents: read

jobs:
    test:
        name: Tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: app
        steps:
            - uses: actions/checkout@v5
            
            - uses: actions/setup-node@v5
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: app/package-lock.json
            
            - name: Instalar dependencias
              run: npm ci

            - name: Ejecutar tests
              run: npm test