name: CI

on:
    pull_request:
        
    workflow_dispatch:

permissions: 
    contents: read

concurrency:
    group: ci-${{github.ref}}
    cancel-in-progress: true

env: 
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{github.repository}}

jobs:
    test:
        name: Tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: app
        steps:
            - uses: actions/checkout@v5
            
            - uses: actions/setup-node@v5
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: app/package-lock.json
            
            - name: Instalar dependencias
              run: npm ci

            - name: Ejecutar tests
              run: npm run test:tap | tee test-results.tap

            - name: Publicar reporte de tests
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: test-results-${{github.run_id}}
                path: app/test-results.tap
                retention-days: 5
                if-no-files-found: error

    build:
        name: Build y push a GHCR
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            id-token: write
            attestations: write

        steps:
        - uses: actions/checkout@v5

        - uses: docker/setup-buildx-action@v3

        - name: Determinar si se publica
          id: gate
          run: |
            if [[ "${{ github.event_name }}" == "pull_request" && \
                    "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
                echo "push=false" >> "$GITHUB_OUTPUT"
                echo "PR desde un fork: se construye pero no se publica."
            else
                echo "push=true" >> "$GITHUB_OUTPUT"
            fi

        - name: Login en GHCR
          if: steps.gate.outputs.push == 'true'
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Calcular tags
          id: meta
          env:
            DEPLOY_SHA: ${{github.event.pull_request.head.sha || github.sha}}
          run: |
            IMAGE="${REGISTRY,,}/${IMAGE_NAME,,}"
            {
                echo "image=${IMAGE}"
                echo "sha=${DEPLOY_SHA}"
                echo "short_sha=${DEPLOY_SHA::7}"
                echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                echo "tags<<TAGS_EOF"
                echo "${IMAGE}:${DEPLOY_SHA}"
                echo "TAGS_EOF"
            } >> "$GITHUB_OUTPUT"

        - name: Construir y publicar
          id: build
          uses: docker/build-push-action@v6
          with:
            context: ./app
            file: ./app/Dockerfile
            push: ${{ steps.gate.outputs.push == 'true' }}
            tags: ${{ steps.meta.outputs.tags }}
            build-args: |
                COMMIT_SHA=${{ steps.meta.outputs.sha }}
                BUILD_TIME=${{ steps.meta.outputs.build_time }}
            labels: |
                org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            cache-from: type=gha
            cache-to: type=gha,mode=max
            provenance: false

        - name: Generar attestation de procedencia
          if: steps.gate.outputs.push == 'true'
          uses: actions/attest-build-provenance@v2
          with:
            subject-name: ${{steps.meta.outputs.image}}
            subject-digest: ${{steps.build.outputs.digest}}
            push-to-registry: true

        - name: Resumen
          run: |
            {
                echo "### Imagen construida"
                echo
                echo "| campo | valor |"
                echo "|---|---|"
                echo "| imagen | \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}\` |"
                echo "| commit | \`${{ steps.meta.outputs.short_sha }}\` |"
                echo "| publicada | ${{ steps.gate.outputs.push }} |"
            } >> "$GITHUB_STEP_SUMMARY"