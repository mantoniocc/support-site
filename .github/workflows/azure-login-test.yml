name: Probar login OIDC

on:
  workflow_dispatch:
    inputs:
      debug_login_enabled:
        description: Activa el debug de login de Azure
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  probar:
    name: Verificar acceso a Azure
    runs-on: ubuntu-latest
    environment: staging          # define el sub del token
    permissions:
      id-token: write             # permite pedir el JWT
      contents: read
    steps:
      - name: Inspeccionar claims del token OIDC
        if: ${{ inputs.debug_login_enabled }}
        shell: bash
        env:
          AUDIENCE: api://AzureADTokenExchange
        run: |
          set -euo pipefail

          RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")

          TOKEN=$(jq -r '.value' <<< "$RESPONSE")

          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
            echo "::error::GitHub no devolvió un token OIDC"
            exit 1
          fi

          PAYLOAD=$(cut -d '.' -f 2 <<< "$TOKEN")

          # JWT usa Base64 URL-safe y puede venir sin padding.
          PAYLOAD="${PAYLOAD//-/+}"
          PAYLOAD="${PAYLOAD//_//}"

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "Claims del token OIDC:"
          printf '%s' "$PAYLOAD" | base64 --decode | jq

      - name: Login en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Quien soy
        run: az account show --query "{suscripcion:name, usuario:user.name}" -o table

      - name: Que alcanzo a ver
        run: |
          echo "Resource groups visibles:"
          az group list --query "[].name" -o tsv

      - name: Leer la Container App
        run: |
          az containerapp show \
            -n ${{ vars.CONTAINER_APP_NAME }} \
            -g ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "{nombre:name, revision:properties.latestRevisionName, url:properties.configuration.ingress.fqdn}" \
            -o table