name: Infra down

on: 
    pull_request:
        types: [labeled]
    workflow_dispatch: 
        inputs:
            environment:
                description: 'Entorno a destruir'
                type: choice
                options:
                    - staging
                    - production
                default: staging
            confirm:
                description: 'Escribe DESTRUIR para confirmar'
                required: true
    schedule:
        # 06:00 UTC. Cron siempre es UTC
        - cron: '0 6 * * *'

permissions: 
    contents: read

concurrency: 
    group: infra-${{inputs.environment || 'staging'}}
    cancel-in-progress: false

jobs:
    destroy:
        name: Destruir ${{inputs.environment || 'staging'}}
        if: >-
            github.event_name != 'pull_request' || 
            contains(github.event.pull_request.labels.*.name, 'destroy environment')
        runs-on: ubuntu-latest
        environment: 
            name: ${{inputs.environment || 'staging'}}
        permissions: 
            id-token: write
            contents: read
            pull-requests: write
        steps:
            - name: Validar confirmación
              if: github.event_name == 'workflow_dispatch'
              run: |
                if [[ "${{inputs.confirm}}" != "DESTRUIR" ]]; then
                    echo "::error::Confirmación incorrecta. Escribe exactamente: DESTRUIR"
                    exit 1
                fi

            - uses: actions/checkout@v5

            - uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Qué se va a borrar
              run: |
                echo "Resource group: ${{vars.AZURE_RESOURCE_GROUP}}"
                az resource list -g "${{vars.AZURE_RESOURCE_GROUP}}" \
                    --query "[].{nombre:name, tipo:type}" -o table
                az deployment group what-if \
                    --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                    --template-file infra/teardown.bicep \
                    --mode Complete \
                    --no-pretty-print || true

            - name: Vaciar el resource group
              run: |
                set -euo pipefail
                az deployment group create \
                    --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                    --name "teardown-$(date -u +%Y%m%d-%H%M%S)" \
                    --template-file infra/teardown.bicep \
                    --mode Complete \
                    --output none

            - name: Verificar
              run: |
                set -euo pipefail
                RESTANTES=$(az resource list -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query "length(@)" -o tsv)
                echo "Recursos restantes: $RESTANTES"
                {
                    echo "### Infraestructura destruida"
                    echo
                    echo "- Entorno: \`${{ inputs.environment || 'staging' }}\`"
                    echo "- Resource group: \`${{ vars.AZURE_RESOURCE_GROUP }}\` (conservado)"
                    echo "- Recursos restantes: $RESTANTES"
                    echo "- Disparado por: \`${{ github.event_name }}\`"
                } >> "$GITHUB_STEP_SUMMARY"
                [[ "$RESTANTES" == "0" ]] || { echo "::error::Quedaron recursos sin borrar"; exit 1; }

            - name: Comentar en el PR
              if: github.event_name == 'pull_request'
              env:
                GH_TOKEN: ${{ github.token }}
              run: |
                gh pr comment "${{ github.event.pull_request.number }}" \
                    --body "Infraestructura de staging destruida. El resource group se conserva; el próximo despliegue la recrea."

