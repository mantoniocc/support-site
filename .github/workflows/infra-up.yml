name: Infra up

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno a levantar'
        type: choice
        options: [staging, production]
        default: staging
      image_tag:
        description: 'Tag de la imagen a desplegar'
        default: latest

permissions:
  contents: read

concurrency:
  group: infra-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  up:
    name: Levantar ${{ inputs.environment || 'staging' }}
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'spin up environment')
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ steps.deploy.outputs.app_url }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Resolver el artefacto
        id: img
        run: |
          set -euo pipefail
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER_LC}/support-site"
          TAG="${{ inputs.image_tag || 'latest' }}"

          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
                     --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest) || {
            echo "::error::No existe ${IMAGE}:${TAG}"; exit 1; }

          echo "image_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "suffix=$(echo "${DIGEST#sha256:}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "Levantando con ${IMAGE}@${DIGEST}"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Aprovisionar
        id: deploy
        run: |
          set -euo pipefail
          ENV_NAME="${{ inputs.environment || 'staging' }}"
          APP_URL=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "up-$(date -u +%Y%m%d-%H%M%S)" \
            --parameters "infra/${ENV_NAME}.bicepparam" \
            --parameters containerImage="${{ steps.img.outputs.image_ref }}" \
                         revisionSuffix="d${{ steps.img.outputs.suffix }}" \
            --query properties.outputs.appUrl.value -o tsv)
          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "Disponible en ${APP_URL}"

      - name: Comprobar salud
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.app_url }}"
          for i in $(seq 1 30); do
            if curl -sf --max-time 10 "${URL}/health" >/dev/null; then
              curl -s "${URL}/api/version" | jq .
              exit 0
            fi
            sleep 5
          done
          echo "::error::La app no respondió"; exit 1