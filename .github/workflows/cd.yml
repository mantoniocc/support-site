name: CD

on:
    pull_request: 
        types: [labeled, synchronize]

permissions: 
    contents: read

# No cancelamos despliegues en vuelo: dejar Azure a medias es peor que esperar.
concurrency: 
    group: cd-staging-${{github.event.pull_request.number}}
    cancel-in-progress: false

jobs:
    deploy-to-staging:
        name: Deplesgar a staging
        if: >-
            contains(github.event.pull_request.labels.*.name, 'stage') && 
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        environment:
            name: staging
            url: ${{steps.deploy.outputs.app_url}}

        permissions: 
            id-token: write
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v5
              with:
                ref: ${{github.event.pull_request.head.sha}}
            
            - name: Resolver la imagen
              id: img
              run: |
                OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
                SHA="${{github.event.pull_request.head.sha}}"
                {
                    echo "sha=${SHA}"
                    echo "short_sha=${SHA::7}"
                    echo "image=ghcr.io/${OWNER_LC}/support-site:${SHA}"
                } >> "$GITHUB_OUTPUT"
                
            - name: Esperar a que el CI publique la imagen
              run: |
                IMAGE="${{steps.img.outputs.image}}"
                echo "Buscando $IMAGE"
                for i in $(seq 1 30); do
                    if docker buildx imagetools inspect $IMAGE >/dev/null 2>&1; then
                        echo "Disponible tras $((i*10))s"
                        exit 0
                    fi
                    echo " intento $i/30..."
                    sleep 10
                done
                echo "::error::La imagen no aparecio en 5 minutos. ¿Termino el workflow de CI?"
                exit 1

            - name: Login en Azure
              uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Desplegar con Bicep
              id: deploy
              run: |
                set -euo pipefail
                APP_URL=$(az deployment group create \
                    --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                    --name "pr-${{ github.event.pull_request.number }}-${{ steps.img.outputs.short_sha }}" \
                    --parameters infra/staging.bicepparam \
                    --parameters containerImage="${{ steps.img.outputs.image }}" \
                                revisionSuffix="${{ steps.img.outputs.short_sha }}" \
                    --query properties.outputs.appUrl.value -o tsv)
                echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
                echo "Desplegado en ${APP_URL}"